name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -v

  memory:
    name: know your limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -c "import love; m = []; [love.another_love(m) for _ in range(365)]"
      - run: sleep 15

  ready:
    name: ready to merge now
    needs: [lint, tests, memory]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
